<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Cố Vấn Tối Cao NationStates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .form-control { background: #0f172a; border: 1px solid #475569; color: #fff; }
        .form-control:focus { background: #0f172a; color: #fff; border-color: #38bdf8; box-shadow: none; }
        .btn-custom { background: #0284c7; color: white; font-weight: bold; width: 100%; }
        .btn-custom:hover { background: #0369a1; color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="text-center text-info mb-1">🏛️ Cố Vấn AI</h3>
        <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">Hệ thống Hỗ trợ Tác chiến NationStates</p>

        {% if error %}
            <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label text-light">Tên Quốc Gia (Nation Name):</label>
                <input type="text" name="nation" class="form-control" placeholder="vd: vzcomm" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Mật khẩu / Autologin PIN:</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu game" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Định hướng / Tư tưởng Quốc gia:</label>
                <input type="text" name="ideology" class="form-control" value="Tự do & Phát triển Kinh tế">
            </div>
            <button type="submit" class="btn btn-custom mt-2 py-2">Đăng Nhập Điều Hành</button>
        </form>
    </div>
</body>
                                                                           </html>
