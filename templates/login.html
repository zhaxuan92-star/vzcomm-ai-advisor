<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quốc Gia - Cố Vấn AI</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-cyan-400">🏛️ Cố Vấn AI NationStates</h1>
            <p class="text-slate-400 text-sm mt-1">Cấu hình thông tin tài khoản để tự động hóa</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500 text-red-300 p-3 rounded-lg text-sm mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Tên Quốc Gia (Nation Name):</label>
                <input type="text" name="nation" required placeholder="Ví dụ: vzcomm" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Mật Khẩu Quốc Gia (Password):</label>
                <input type="password" name="password" required placeholder="Nhập mật khẩu trong game" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Định Hướng Phát Triển Quốc Gia:</label>
                <select name="ideology" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500">
                    <option value="Tự do cá nhân, Kinh tế thị trường & Dân chủ">Tự do & Dân chủ</option>
                    <option value="Tập trung quyền lực, An ninh quân sự & Kỷ luật">Quân sự & Kỷ luật</option>
                    <option value="Tối ưu hóa Tăng trưởng Kinh tế & Doanh nghiệp">Phát triển Kinh tế</option>
                    <option value="Công bằng Xã hội, Môi trường & Phúc lợi">Phúc lợi & Môi trường</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg shadow-lg transition mt-2">
                🚀 ĐĂNG NHẬP
            </button>
        </form>
    </div>
</body>
        </html>
