<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Cố Vấn AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .login-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #cbd5e1; margin-bottom: 5px; }
        input, select { width: 100%; background-color: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        .btn-submit { width: 100%; background-color: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #0369a1; }
        .error-msg { background-color: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="color: #38bdf8; text-align: center; margin-bottom: 5px;">🏛️ Cố Vấn AI NationStates</h2>
        <p style="color: #94a3b8; text-align: center; font-size: 12px; margin-bottom: 20px;">Cấu hình tài khoản để kích hoạt Bot Auto</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Tên Quốc Gia (Nation Name):</label>
                <input type="text" name="nation" required placeholder="ví dụ: vzcomm">
            </div>

            <div class="form-group">
                <label>Mật Khẩu Quốc Gia (Password):</label>
                <input type="password" name="password" required placeholder="Mật khẩu game">
            </div>

            <div class="form-group">
                <label>Định Hướng Quốc Gia:</label>
                <select name="ideology">
                    <option value="Tự do cá nhân, Kinh tế thị trường & Dân chủ">Tự do & Dân chủ</option>
                    <option value="Tập trung quyền lực, An ninh quân sự & Kỷ luật">Quân sự & Kỷ luật</option>
                    <option value="Tối ưu hóa Tăng trưởng Kinh tế & Doanh nghiệp">Phát triển Kinh tế</option>
                    <option value="Công bằng Xã hội, Môi trường & Phúc lợi">Phúc lợi & Môi trường</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">🚀 ĐĂNG NHẬP BOT</button>
        </form>
    </div>
</body>
</html>
